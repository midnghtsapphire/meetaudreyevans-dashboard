name: Issue Triage Labels

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Apply revvel triage labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();

            const labelSpecs = [
              { name: 'documentation', color: '0075ca', description: 'Documentation updates or requirements' },
              { name: 'revvel-standards', color: '5319e7', description: 'Revvel standards process item' },
              { name: 'ship-to-market', color: '1d76db', description: 'Launch readiness and GTM work' },
              { name: 'integration:gohighlevel', color: '0e8a16', description: 'GoHighLevel integration scope' },
              { name: 'research', color: 'fbca04', description: 'Discovery and research-heavy tasks' }
            ];

            const matching = [];
            if (text.includes('revvel')) matching.push('revvel-standards');
            if (text.includes('ship to market') || text.includes('ship-to-market') || text.includes('go to market')) matching.push('ship-to-market');
            if (text.includes('gohighlevel')) matching.push('integration:gohighlevel');
            if (text.includes('research') || text.includes('scrape') || text.includes('docs')) matching.push('research');

            if (matching.length === 0) matching.push('documentation');
            if (!matching.includes('documentation') && text.includes('document')) matching.push('documentation');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const label of labelSpecs) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                } else {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: [...new Set(matching)]
            });
